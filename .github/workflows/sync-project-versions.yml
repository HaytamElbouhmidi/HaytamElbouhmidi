# Version 1.0.0
name: Sync profile project versions

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update version badges and overview
        run: python scripts/sync_project_versions.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo 'Profile versions are current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Sync profile application versions'
          git push
